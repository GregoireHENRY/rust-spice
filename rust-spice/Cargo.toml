[package]
name = "rust-spice"
version = "1.0.1"
authors = ["Grégoire Henry <greg.henry@mail.com>"]
edition = "2021"
rust-version = "1.70"
description = "WOW! The complete NASA/NAIF Spice toolkit is actually usable on Rust."
license = "Apache-2.0"
repository = "https://github.com/GregoireHENRY/rust-spice"
keywords = ["space", "spice", "nasa", "naif", "kernels"]
categories = ["algorithms", "api-bindings", "science"]

[lib]
name = "spice"

[features]
default = ["dep:cspice-sys"]
download = ["dep:cspice-sys", "cspice-sys/downloadcspice"]
noclang = ["dep:cspice-sys-no-clang"]
lock = []
# Declare the CSPICE API instead of generating it from the toolkit installed on this machine, and
# link nothing. Enough to document or type check the crate, never enough to run it. It is what
# docs.rs builds, because the build script of `cspice-sys` cannot run there.
unlinked = []

[dependencies]
libc = "0.2"
cspice-sys = { package = "cspice-sys", version = "1", optional = true }
cspice-sys-no-clang = { package = "cspice-sys", version = "<=0.0.1", optional = true }
rust-spice-derive = { version = "1.0", path = "../rust-spice-derive" }

[dev-dependencies]
approx = "0.5"
itertools = "0.15"
serial_test = "3.2"

[package.metadata.docs.rs]
# Not `all-features`: `lock` hides `raw` and `neat` behind the guard and drops the crate level
# documentation, and the whole API is shown anyway because the crate marks it `cfg(doc)`.
no-default-features = true
features = ["unlinked"]
rustdoc-args = ["--cfg", "docsrs"]
